services:
  db:
    image: postgis/postgis:17-3.5
    container_name: sistema_alertas_db
    environment:
      POSTGRES_DB: sistema_alertas
      POSTGRES_USER: alertas
      POSTGRES_PASSWORD: alertas_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
