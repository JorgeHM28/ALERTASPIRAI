# Sistema completo:            docker compose up -d --build
# Solo la base (para dotnet run): docker compose up -d db
services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64 # la imagen oficial no publica arm64; en Mac Apple Silicon corre con Rosetta
    container_name: sistema_alertas_db
    environment:
      POSTGRES_DB: sistema_alertas
      POSTGRES_USER: alertas
      POSTGRES_PASSWORD: alertas_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertas -d sistema_alertas"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/SistemaAlertas.Api/Dockerfile
    container_name: sistema_alertas_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development # crea el usuario admin y publica /openapi
      ConnectionStrings__Alertas: Host=db;Port=5432;Database=sistema_alertas;Username=alertas;Password=alertas_dev
      Cors__Origenes__0: http://localhost:5173
      # SMS: Simulador por defecto. Para enviar con un celular (SMS Gateway for Android), crea un archivo .env
      # junto a este (ver .env.ejemplo y docs/sms-gateway.md). El .env no se sube al repositorio.
      Sms__Modo: ${SMS_MODO:-Simulador}
      Sms__SmsGateway__Url: ${SMS_GATEWAY_URL:-}
      Sms__SmsGateway__Usuario: ${SMS_GATEWAY_USUARIO:-}
      Sms__SmsGateway__Contrasena: ${SMS_GATEWAY_CONTRASENA:-}
      # WhatsApp a un grupo (WAHA) y Email (SMTP): apagados si faltan datos. Ver docs/whatsapp-email.md.
      WhatsApp__Url: ${WHATSAPP_URL:-}
      WhatsApp__ApiKey: ${WAHA_API_KEY:-}
      WhatsApp__Grupos__0__Nombre: ${WHATSAPP_GRUPO_NOMBRE:-Alertas río Piraí}
      WhatsApp__Grupos__0__Id: ${WHATSAPP_GRUPO_ID:-}
      Email__Servidor: ${EMAIL_SERVIDOR:-}
      Email__Puerto: ${EMAIL_PUERTO:-587}
      Email__Usuario: ${EMAIL_USUARIO:-}
      Email__Contrasena: ${EMAIL_CONTRASENA:-}
      Email__Remitente: ${EMAIL_REMITENTE:-}
    ports:
      - "5080:8080"

  web:
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:5080
    container_name: sistema_alertas_web
    depends_on:
      - api
    ports:
      - "5173:80"

  # WhatsApp HTTP API (https://waha.devlike.pro). Solo arranca con: docker compose --profile whatsapp up -d
  # Se vincula a un número escaneando un QR en http://localhost:3000/dashboard.
  waha:
    image: ${WAHA_IMAGEN:-devlikeapro/waha:arm}
    container_name: sistema_alertas_waha
    profiles: [whatsapp]
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USUARIO:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_CONTRASENA:-}
    ports:
      - "3000:3000"
    volumes:
      - waha_sesiones:/app/.sessions

volumes:
  pgdata:
  waha_sesiones:
