$kind: http-request
name: 'No se prepara desde una referencia inexistente'
method: POST
url: '{{baseUrl}}/api/avisos/{{senamhiHuerfanoId}}/versiones'
order: 2500
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 400', () => pm.response.to.have.status(400));
      pm.test('dice que la referencia no existe', () => pm.expect(pm.response.json().detail).to.include('Referencia inexistente'));
