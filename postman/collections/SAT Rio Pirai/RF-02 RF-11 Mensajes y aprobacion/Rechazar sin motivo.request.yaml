$kind: http-request
name: 'Rechazar sin motivo'
method: POST
url: '{{baseUrl}}/api/versiones/{{versionId}}/rechazar'
order: 600
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "motivo": "" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 400', () => pm.response.to.have.status(400));
      pm.test('exige el motivo', () => pm.expect(pm.response.json().detail).to.include('motivo'));
