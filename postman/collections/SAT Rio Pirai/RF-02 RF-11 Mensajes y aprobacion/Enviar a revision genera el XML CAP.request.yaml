$kind: http-request
name: 'Enviar a revision genera el XML CAP'
method: POST
url: '{{baseUrl}}/api/versiones/{{versionId}}/enviar-revision'
order: 500
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      const v = pm.response.json();
      pm.test('pasa a revisión', () => pm.expect(v.detalle.resumen.estado).to.eql('EnRevision'));
      pm.test('el XML es un Alert CAP 1.2', () => {
        pm.expect(v.detalle.xmlCap).to.include('urn:oasis:names:tc:emergency:cap:1.2');
        pm.expect(v.detalle.xmlCap).to.include('<msgType>Alert</msgType>');
      });
      pm.test('el SMS lleva el nivel en palabras', () => pm.expect(v.textoSms).to.match(/^ALERTA ROJA:/));
      pm.collectionVariables.set('xmlGenerado', v.detalle.xmlCap);
