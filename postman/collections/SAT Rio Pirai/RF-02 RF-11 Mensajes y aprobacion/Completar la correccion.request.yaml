$kind: http-request
name: 'Completar la correccion'
method: PUT
url: '{{baseUrl}}/api/versiones/{{versionId}}'
order: 950
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "titular": "Crecida en Porongo: reunirse en el colegio desde las 18:00" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().detalle;
      pm.test('ya está completa', () => pm.expect(d.resumen.faltantes).to.be.empty);
      pm.test('la corrección conserva el protocolo oficial', () => pm.expect(d.protocoloId).to.eql(pm.collectionVariables.get('protocoloId')));
