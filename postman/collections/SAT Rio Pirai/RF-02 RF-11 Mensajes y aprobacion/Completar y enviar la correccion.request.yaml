$kind: http-request
name: 'Completar y enviar la correccion'
method: POST
url: '{{baseUrl}}/api/versiones/{{versionId}}/enviar-revision'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      pm.test('pasa a revisión', () => pm.expect(pm.response.json().detalle.resumen.estado).to.eql('EnRevision'));
