$kind: http-request
method: PUT
url: '{{baseUrl}}/api/contactos/{{contactoNoAutorizadoId}}'
order: 5500
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombre": "María Rojas",
      "cargo": "Vecina",
      "activo": true,
      "procedencia": "Padrón municipal de Porongo",
      "autorizado": true,
      "referenciaAutorizacion": "Formulario de consentimiento F-221",
      "fechaAutorizacion": "2026-11-02",
      "canales": [ { "tipo": "WhatsApp", "destino": "+59172222222", "preferido": true } ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      pm.test('ahora está habilitado', () => pm.expect(pm.response.json().habilitado).to.be.true);
