$kind: http-request
method: POST
url: '{{baseUrl}}/api/comunidades/{{comunidadId}}/contactos'
order: 3000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombre": "Juan Pérez",
      "cargo": "Presidente OTB",
      "activo": true,
      "procedencia": "Asamblea comunal",
      "autorizado": true,
      "referenciaAutorizacion": "Acta de asamblea 14/2026",
      "fechaAutorizacion": "2026-10-28",
      "canales": [
        { "tipo": "Sms", "destino": "+591 71234567", "preferido": true },
        { "tipo": "Email", "destino": "Juan@Ejemplo.com", "preferido": false }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));

      const c = pm.response.json();
      pm.test('normaliza el teléfono y el email', () => {
        pm.expect(c.canales[0].destino).to.eql('+59171234567');
        pm.expect(c.canales[1].destino).to.eql('juan@ejemplo.com');
      });
      pm.test('guarda procedencia y autorización', () => {
        pm.expect(c.procedencia).to.eql('Asamblea comunal');
        pm.expect(c.autorizado).to.be.true;
        pm.expect(c.referenciaAutorizacion).to.eql('Acta de asamblea 14/2026');
        pm.expect(c.fechaAutorizacion).to.eql('2026-10-28');
      });
      pm.test('queda habilitado para recibir alertas', () => pm.expect(c.habilitado).to.be.true);
      pm.collectionVariables.set('contactoId', c.id);
