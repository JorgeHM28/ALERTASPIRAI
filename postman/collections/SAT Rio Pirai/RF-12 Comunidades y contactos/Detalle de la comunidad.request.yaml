$kind: http-request
method: GET
url: '{{baseUrl}}/api/comunidades/{{comunidadId}}'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));

      const c = pm.response.json();
      pm.test('tiene los 3 contactos creados', () => pm.expect(c.contactos).to.have.lengthOf(3));
      pm.test('solo 1 está habilitado', () => {
        pm.expect(c.contactosHabilitados).to.eql(1);
        pm.expect(c.sinCanal).to.be.false;
      });
