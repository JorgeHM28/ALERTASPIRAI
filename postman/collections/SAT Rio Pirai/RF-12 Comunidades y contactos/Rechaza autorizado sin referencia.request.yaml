$kind: http-request
method: POST
url: '{{baseUrl}}/api/comunidades/{{comunidadId}}/contactos'
order: 3100
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombre": "Sin respaldo",
      "activo": true,
      "procedencia": "Llamada telefónica",
      "autorizado": true,
      "canales": [ { "tipo": "Sms", "destino": "+59171111111", "preferido": true } ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 400', () => pm.response.to.have.status(400));
      pm.test('pide la referencia de la autorización', () => pm.expect(pm.response.json().detail).to.include('referencia'));
