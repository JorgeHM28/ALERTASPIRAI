$kind: http-request
method: POST
url: '{{baseUrl}}/api/comunidades/{{comunidadId}}/contactos'
order: 3150
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombre": "Sin procedencia",
      "activo": true,
      "procedencia": "",
      "autorizado": false,
      "canales": [ { "tipo": "Sms", "destino": "+59171111112", "preferido": true } ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 400', () => pm.response.to.have.status(400));
      pm.test('pide la procedencia', () => pm.expect(pm.response.json().detail).to.include('procedencia'));
