$kind: http-request
method: GET
url: '{{baseUrl}}/api/salud'
order: 1000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));

      pm.test('la base de datos está conectada', () => pm.expect(pm.response.json().baseDeDatos).to.eql('ok'));
