$kind: http-request
name: 'Aprobar el Cancel'
method: POST
url: '{{baseUrl}}/api/versiones/{{versionCancelId}}/aprobar'
order: 650
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      pm.test('el Cancel queda aprobado', () => pm.expect(pm.response.json().detalle.resumen.estado).to.eql('Aprobada'));
