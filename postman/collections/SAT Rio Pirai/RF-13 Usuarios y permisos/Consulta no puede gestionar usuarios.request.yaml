$kind: http-request
method: GET
url: '{{baseUrl}}/api/usuarios'
order: 11000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{tokenConsulta}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 403', () => pm.response.to.have.status(403));
