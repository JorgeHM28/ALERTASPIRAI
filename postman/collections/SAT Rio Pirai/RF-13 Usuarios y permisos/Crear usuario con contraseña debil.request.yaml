$kind: http-request
name: 'Crear usuario con contraseña débil'
method: POST
url: '{{baseUrl}}/api/usuarios'
order: 7000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombreUsuario": "debil{{$timestamp}}",
      "nombreCompleto": "X",
      "email": "debil{{$timestamp}}@x.bo",
      "rol": "Operador",
      "contrasena": "123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 400', () => pm.response.to.have.status(400));
