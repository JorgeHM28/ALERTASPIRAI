$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 8000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombreUsuario": "{{usuarioConsulta}}",
      "contrasena": "Consulta123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('tokenConsulta', pm.response.json().token);
