$kind: http-request
method: GET
url: '{{baseUrl}}/api/zonas'
order: 9000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{tokenConsulta}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
