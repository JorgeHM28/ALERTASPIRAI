$kind: http-request
method: POST
url: '{{baseUrl}}/api/usuarios'
order: 6000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombreUsuario": "{{usuarioConsulta}}",
      "nombreCompleto": "Usuario de solo lectura",
      "email": "{{usuarioConsulta}}@sat-pirai.local",
      "roles": ["Consulta"],
      "contrasena": "Consulta123"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('usuarioConsulta', 'consulta' + Date.now());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('usuarioConsultaId', pm.response.json().id);
