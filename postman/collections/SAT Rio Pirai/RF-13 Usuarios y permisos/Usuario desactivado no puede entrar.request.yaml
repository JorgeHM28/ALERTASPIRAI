$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 13000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombreUsuario": "{{usuarioConsulta}}",
      "contrasena": "Consulta123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 401', () => pm.response.to.have.status(401));
