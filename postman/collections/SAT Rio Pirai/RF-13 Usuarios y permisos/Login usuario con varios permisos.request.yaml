$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 6300
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombreUsuario": "{{usuarioMulti}}",
      "contrasena": "Multi12345"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      pm.test('el login devuelve los dos roles', () => pm.expect(pm.response.json().usuario.roles).to.have.members(['Operador', 'Aprobador']));
      pm.collectionVariables.set('tokenMulti', pm.response.json().token);
