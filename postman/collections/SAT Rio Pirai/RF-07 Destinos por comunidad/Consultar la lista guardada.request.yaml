$kind: http-request
name: 'Consultar la lista guardada'
method: GET
url: '{{baseUrl}}/api/versiones/{{versionUpdateId}}/destinos'
order: 700
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      pm.test('conserva los canales elegidos', () => pm.expect(pm.response.json().canales).to.have.members(['Sms', 'WhatsApp', 'Radio']));
