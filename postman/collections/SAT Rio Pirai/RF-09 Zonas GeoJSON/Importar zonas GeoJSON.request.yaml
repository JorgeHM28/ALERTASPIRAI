scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));

      const r = pm.response.json();
      pm.test('importa o actualiza las 3 zonas del ejemplo', () => pm.expect(r.creadas + r.actualizadas).to.eql(3));
