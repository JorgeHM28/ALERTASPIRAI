          "geometry": { "type": "Polygon", "coordinates": [[[-63.2550,-17.7700],[-63.2150,-17.7700],[-63.2150,-17.8250],[-63.2550,-17.8250],[-63.2550,-17.7700]]] }
        },
        {
          "type": "Feature",
          "properties": { "nombre": "Urubó - Playa Piraí", "nivelRiesgo": "Alto", "descripcion": "Urbanizaciones del Urubó cercanas al cauce." },
          "geometry": { "type": "Polygon", "coordinates": [[[-63.2150,-17.7350],[-63.1850,-17.7350],[-63.1850,-17.7700],[-63.2150,-17.7700],[-63.2150,-17.7350]]] }
