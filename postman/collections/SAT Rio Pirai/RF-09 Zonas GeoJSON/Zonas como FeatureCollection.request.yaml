$kind: http-request
method: GET
url: '{{baseUrl}}/api/zonas/geojson'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));

      pm.test('es una FeatureCollection', () => pm.expect(pm.response.json().type).to.eql('FeatureCollection'));
