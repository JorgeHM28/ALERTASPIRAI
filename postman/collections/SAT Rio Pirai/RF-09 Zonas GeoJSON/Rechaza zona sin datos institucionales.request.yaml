$kind: http-request
method: POST
url: '{{baseUrl}}/api/zonas'
order: 2200
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nombre": "Zona sin fuente {{$timestamp}}",
      "nivelRiesgo": "Bajo",
      "geometria": {"type": "Polygon", "coordinates": [[[-63.50,-17.52],[-63.49,-17.52],[-63.49,-17.53],[-63.50,-17.53],[-63.50,-17.52]]]}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 400', () => pm.response.to.have.status(400));
