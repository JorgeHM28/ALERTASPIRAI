$kind: http-request
method: POST
url: '{{baseUrl}}/api/avisos'
order: 5000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "evento": "Crecida del río Piraí",
      "urgencia": "Immediate",
      "severidad": "Severe",
      "certeza": "Observed",
      "titular": "Alerta roja en Porongo",
      "instruccion": "Evacuar hacia zonas altas.",
      "expira": "{{capExpiraFutura}}",
      "zonaIds": ["{{zonaId}}"]
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Fechas relativas a hoy, en formato CAP (sin milisegundos).
      const cap = (d) => d.toISOString().replace(/\.\d{3}Z$/, '+00:00');
      const ahora = Date.now();
      pm.collectionVariables.set('capEfectivo', cap(new Date(ahora - 3600e3)));
      pm.collectionVariables.set('capExpiraFutura', cap(new Date(ahora + 2 * 86400e3)));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));

      const a = pm.response.json();
      pm.test('se generó como aviso manual', () => pm.expect(a.formato).to.eql('Manual'));
      pm.test('completo y vigente: apto para difusión', () => pm.expect(a.aptoParaDifusion).to.be.true);
      pm.test('no tiene documento importado', () => pm.expect(a.tieneOriginal).to.be.false);
      pm.collectionVariables.set('avisoManualId', a.id);
