$kind: http-request
method: GET
url: '{{baseUrl}}/api/avisos/{{avisoJsonId}}/original'
order: 3100
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const CryptoJS = require('crypto-js');
      pm.test('responde 200 en JSON', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
      const texto = pm.response.text();
      pm.test('es el JSON exacto que se importó (espacios y orden incluidos), no el XML normalizado', () => {
        pm.expect(texto).to.include('"sender":     "coed@santacruz.gob.bo"');
        pm.expect(texto).to.include('"status": "Actual", "msgType": "Alert", "scope": "Public",');
        pm.expect(texto.trim().startsWith('{')).to.be.true;
      });
      pm.test('el SHA-256 coincide con el contenido', () =>
        pm.expect(CryptoJS.SHA256(texto).toString()).to.eql(pm.response.headers.get('X-Contenido-Sha256')));
