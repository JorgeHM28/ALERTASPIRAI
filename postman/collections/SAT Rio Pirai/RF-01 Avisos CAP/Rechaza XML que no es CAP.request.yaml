$kind: http-request
method: POST
url: '{{baseUrl}}/api/avisos/importar'
order: 4200
headers:
  - key: Content-Type
    value: 'application/xml'
body:
  type: xml
  content: |-
    <boletin><titulo>Esto no es un mensaje CAP</titulo></boletin>
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 400', () => pm.response.to.have.status(400));
      pm.test('explica que no es CAP 1.2', () => pm.expect(pm.response.json().detail).to.include('CAP 1.2'));
