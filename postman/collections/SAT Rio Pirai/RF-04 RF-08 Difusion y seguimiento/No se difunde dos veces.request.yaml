$kind: http-request
name: 'Una versión no se difunde dos veces'
method: POST
url: '{{baseUrl}}/api/difusion/{{versionUpdateId}}'
order: 400
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{tokenAprobador}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 400', () => pm.response.to.have.status(400));
      pm.test('explica que ya se difundió', () => pm.expect(pm.response.json().detail).to.include('ya se difundió'));
