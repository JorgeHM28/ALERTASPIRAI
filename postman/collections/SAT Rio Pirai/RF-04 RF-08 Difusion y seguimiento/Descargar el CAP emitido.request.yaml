$kind: http-request
name: 'Descargar el XML CAP emitido'
method: GET
url: '{{baseUrl}}/api/difusion/{{versionUpdateId}}/cap'
order: 300
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      pm.test('es XML CAP 1.2', () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('xml');
        pm.expect(pm.response.text()).to.include('urn:oasis:names:tc:emergency:cap:1.2');
      });
      pm.test('es un Update con su referencia', () => {
        pm.expect(pm.response.text()).to.include('<msgType>Update</msgType>');
        pm.expect(pm.response.text()).to.include('<references>');
      });
