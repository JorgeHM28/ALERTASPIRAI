$kind: http-request
name: 'Importar un aviso desde Excel (plantilla)'
method: POST
url: '{{baseUrl}}/api/avisos/importar'
order: 1300
headers:
  - key: Content-Type
    value: 'text/plain'
body:
  type: text
  content: |-
    
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Se puede correr varias veces: la segunda vez el identificador ya existe y se rechaza como duplicado.
      pm.test('se registra (201) o ya estaba (400 duplicado)', () => pm.expect([201, 400]).to.include(pm.response.code));
      if (pm.response.code === 201) {
        const a = pm.response.json();
        pm.test('se reconoce como Excel', () => pm.expect(a.formato).to.eql('Excel'));
        pm.test('es una alerta roja apta', () => pm.expect(a.aptoParaDifusion).to.eql(true));
      } else {
        pm.test('el rechazo es por duplicado', () => pm.expect(pm.response.json().detail.toLowerCase()).to.include('ya'));
      }
