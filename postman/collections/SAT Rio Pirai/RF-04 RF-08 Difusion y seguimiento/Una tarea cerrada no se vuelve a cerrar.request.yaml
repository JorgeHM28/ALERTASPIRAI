$kind: http-request
name: 'Una tarea cerrada no se vuelve a cerrar'
method: POST
url: '{{baseUrl}}/api/difusion/tareas/{{tareaRadioId}}/no-realizada'
order: 800
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "observacion": "cambio de opinión" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 400', () => pm.response.to.have.status(400));
      pm.test('dice que ya terminó', () => pm.expect(pm.response.json().detail).to.include('ya terminó'));
